name: build

on:
  push:
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug
      - name: Verify Xposed metadata
        run: |
          python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify-apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
